<!DOCTYPE html>
<html lang="ko">
  <script src="shell.js" defer></script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSL — 비밀 기록</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portal.css">
</head>
<body class="archive-body">
  <main class="archive-page archive-campaign-page">
    <header class="archive-intro archive-campaign-intro">
      <p class="eyebrow"><i></i> 익명 채널 // 지금 접속 가능</p>
      <h1>아무도 모르게, 잠깐.</h1>
      <p>숨겨둔 마음을 꺼내는 데는 이름도, 설명도 필요하지 않습니다.</p>
    </header>

    <section class="campaign-gateway" aria-label="CSL 캠페인 영상">
      <div class="campaign-screen" id="campaignScreen">
        <video id="campaignVideo" data-src="assets/videos/csl-campaign.mp4" playsinline preload="none"></video>
        <div class="campaign-noise" aria-hidden="true"></div>
        <div class="campaign-scanline" aria-hidden="true"></div>

        <div class="campaign-hud" aria-hidden="true">
          <span>CHANNEL 04</span>
          <span><i></i> LIVE</span>
        </div>

        <button class="campaign-access" id="campaignAccess" type="button">
          <span class="campaign-access-mark" aria-hidden="true"></span>
          <small>기록이 남지 않는 접속</small>
          <strong>익명 채널 열기</strong>
          <em>클릭하면 영상이 시작됩니다</em>
        </button>

        <button class="campaign-replay" id="campaignReplay" type="button">처음부터 보기</button>
      </div>

      <footer class="campaign-footer">
        <p>참고 있던 마음을 잠깐 내려놓으세요.</p>
        <span>익명 접속 · 기록 없음 · 눈치 볼 필요 없음</span>
      </footer>
    </section>
  </main>

  <script>
    const screen = document.getElementById('campaignScreen');
    const video = document.getElementById('campaignVideo');
    const access = document.getElementById('campaignAccess');
    const replay = document.getElementById('campaignReplay');

    access.addEventListener('click', async () => {
      if (!video.src) {
        video.src = video.dataset.src;
        video.load();
      }

      screen.classList.add('is-connecting');
      access.querySelector('strong').textContent = '보안 채널 연결 중';
      access.querySelector('em').textContent = '신호를 복호화하고 있습니다';

      try {
        await video.play();
        video.controls = true;
        screen.classList.remove('is-connecting');
        screen.classList.add('is-live');
      } catch (error) {
        screen.classList.remove('is-connecting');
        access.querySelector('strong').textContent = '영상 연결 대기 중';
        access.querySelector('em').textContent = '캠페인 영상 파일을 확인해주세요';
      }
    });

    replay.addEventListener('click', () => {
      video.currentTime = 0;
      video.play();
    });
  </script>
</body>
</html>
