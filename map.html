<!DOCTYPE html>
<html lang="ko">
  <script src="shell.js" defer></script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSL — Global Signal Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portal.css">
</head>
<body class="map-body">
  <header class="map-page-intro">
    <p class="eyebrow">GLOBAL SIGNAL NETWORK // LIVE</p>
  
    <h1>
      <span class="map-live-orb" aria-hidden="true"></span>
      <span>SEE WHAT THE WORLD FEELS.</span>
    </h1>
  
    <p class="map-page-note">
      신호는 익명화되며 위치는 도시 단위로만 표시된다.
    </p>
  </header>

  <main class="map-page">
   
    <div class="map-console">
      <section class="world-panel">
        <div class="console-head">
          <span>INTERCEPT MAP</span>
          <span id="mapClock">00:00:00</span>
        </div>
        <div class="world-map" id="worldMap">
          <span class="continent c-na">NORTH AMERICA</span>
          <span class="continent c-eu">EUROPE</span>
          <span class="continent c-as">ASIA</span>
          <span class="continent c-oc">OCEANIA</span>
          <div class="map-scan"></div>
          <div class="map-privacy">ANONYMIZED SIGNALS // APPROXIMATE LOCATION</div>
        </div>
        <div class="intercept-line" id="interceptLine">INTERCEPTING SIGNAL...</div>
      </section>

      <aside class="signal-log-panel">
        <div class="console-head">
          <span>LIVE SIGNALS</span>
          <span id="signalCount">1842 ACTIVE</span>
        </div>
        <div class="signal-log-list" id="signalLogList"></div>
      </aside>
    </div>

    <section class="signal-ranking">
      <div class="ranking-head">
        <p class="eyebrow">MOST ACTIVE NODES</p>
        <h2>WHERE THE PRESSURE IS.</h2>
      </div>
      <div id="nodeRanking"></div>
    </section>
  </main>

  <script src="map.js"></script>
  <script src="country-logs.js"></script>
</body>
</html>
