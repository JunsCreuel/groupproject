<!DOCTYPE html>
<html lang="ko">
  <script src="shell.js" defer></script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSL — 전 세계 익명 신호 지도</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portal.css">
</head>
<body class="map-body">
  <main class="map-page">
    <header class="map-page-intro">
      <p class="eyebrow">전 세계 익명 신호망 // LIVE</p>

      <h1>
        <span class="map-live-orb" aria-hidden="true"></span>
        <span>지금 세계가 느끼는 것.</span>
      </h1>

      <p class="map-page-note">
        신호는 익명화되며 위치는 도시 단위로만 표시된다.
      </p>
    </header>

    <div class="map-console">
      <section class="world-panel">
        <div class="console-head">
          <span>신호 포착 지도</span>
          <span id="mapClock">00:00:00</span>
        </div>
        <div class="world-map" id="worldMap">
          <span class="continent c-na">북아메리카</span>
          <span class="continent c-eu">유럽</span>
          <span class="continent c-as">아시아</span>
          <span class="continent c-oc">오세아니아</span>
          <div class="map-scan"></div>
          <div class="map-privacy">익명화된 신호 // 도시 단위 위치</div>
        </div>
        <div class="intercept-line" id="interceptLine">신호 포착 중...</div>
      </section>

      <aside class="signal-log-panel">
        <div class="console-head">
          <span>실시간 익명 신호</span>
          <span id="signalCount">1842명 접속 중</span>
        </div>
        <div class="signal-log-list" id="signalLogList"></div>
      </aside>
    </div>

    <section class="signal-ranking">
      <div class="ranking-head">
        <p class="eyebrow">가장 활발한 NODE</p>
        <h2>압박이 쌓이는 곳.</h2>
      </div>
      <div id="nodeRanking"></div>
    </section>
  </main>

  <script src="map.js"></script>
  <script src="country-logs.js"></script>
</body>
</html>
